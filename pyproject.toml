[project]
name = "rag"
version = "0.1.0"
description = "RAG over Japanese labour law with measured retrieval and generation quality"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "arize-phoenix-otel>=0.17.2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "mcp[cli]>=2.2.0",
    "numpy>=2.5.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "sudachidict-core>=20260723",
    "sudachipy>=0.6.11",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.52.4",
]

# torch comes transitively via sentence-transformers, CPU-only (PyPI serves
# CPU wheels on Windows). This is deliberate — decided 2026-09-29:
#  - the GPU is a GTX 1060 6 GB (Pascal, sm_61). Current CUDA wheels (cu128+)
#    have no Pascal kernels: torch reports CUDA available and then fails at
#    the first kernel with "no kernel image". cu126 is the last index that
#    supports it, and may carry no Python 3.14 wheels.
#  - the 6 GB are already taken by Ollama (gemma4 + bge-m3 do not fit
#    together). A resident 2 GB cross-encoder would push gemma partly onto
#    the CPU: a faster rerank for a slower generation.
# All measurements in the README were made with the reranker on the CPU.

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# langsmith (pulled in by langgraph) uses an asyncio API deprecated in 3.14
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]

[tool.ruff]
src = ["src", "."]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP"]
ignore = ["E501"]
